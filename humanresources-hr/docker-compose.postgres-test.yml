services:
  postgres-test:
    image: postgres:18.6-alpine
    container_name: humanresources-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: humanresources_hr_test
      POSTGRES_USER: hr_test
      POSTGRES_PASSWORD: hr_test_local_only
    ports:
      - "5433:5432"
    volumes:
      # Volume exclusivo de testes: não reutiliza nem altera o volume PostgreSQL 16 existente.
      - humanresources_postgres18_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  humanresources_postgres18_test_data:
